<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tournament Swag</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

<style>

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background:
    radial-gradient(ellipse 140% 45% at 50% 0%, #b8b8b8 0%, #787878 20%, transparent 50%),
    radial-gradient(ellipse 80% 40% at 15% 50%, rgba(160,160,160,0.22) 0%, transparent 55%),
    radial-gradient(ellipse 80% 40% at 85% 50%, rgba(160,160,160,0.22) 0%, transparent 55%),
    radial-gradient(ellipse 110% 45% at 50% 100%, #9b0f0f 0%, #5c0808 30%, transparent 60%),
    linear-gradient(170deg, #4a4a4a 0%, #252525 30%, #181818 52%, #2c0909 75%, #450c0c 100%);
  color: #f0ece4;
  padding: 60px 20px;
  display: flex;
  justify-content: center;
}

/* GRID */
.container {
  max-width: 1000px;
  width: 100%;
}

/* HEADER */
.header {
  text-align: center;
  margin-bottom: 40px;
}

.header h1 {
  font-family: 'Bebas Neue';
  font-size: 70px;
  letter-spacing: 3px;
}

.header span {
  color: #d72323;
}

/* GRID LAYOUT */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 22px;
}

/* CARD */
.card {
  position: relative;
  display: block;
  border-radius: 6px;
  overflow: hidden;
  text-decoration: none;
  border: 1px solid #333;
  background: #111;
  transition: all 0.3s ease;
}

/* IMAGE */
.card img {
  width: 100%;
  height: 260px;
  object-fit: cover;
  display: block;
}

/* OVERLAY LABEL */
.card-label {
  position: absolute;
  bottom: 0;
  width: 100%;
  padding: 14px;
  background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
  font-family: 'Bebas Neue';
  font-size: 20px;
  letter-spacing: 2px;
  color: #fff;
}

/* HOVER */
.card:hover {
  transform: translateY(-6px);
  border-color: #d72323;
  box-shadow:
    0 10px 40px rgba(0,0,0,0.6),
    0 0 30px rgba(215,35,35,0.4);
}

.card:hover .card-label {
  color: #d72323;
}

/* PLACEHOLDER STYLE */
.placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 260px;
  font-family: 'Bebas Neue';
  font-size: 24px;
  letter-spacing: 2px;
  color: #666;
}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>TOURNAMENT <span>SWAG</span></h1>
  </div>

  <div class="grid">

    <!-- ✅ TOURNAMENT 1 -->
    <a class="card" href="https://your-link-1.com">
      <img src="images/wesley-cup.png">
      <div class="card-label">Wesley Clover Cup</div>
    </a>

    <!-- ✅ TOURNAMENT 2 -->
    <a class="card" href="https://your-link-2.com">
      <img src="images/warrior.png">
      <div class="card-label">Warrior Classic</div>
    </a>

    <!-- ✅ PLACEHOLDERS -->
    <a class="card" href="#">
      <div class="placeholder">Tourney 3</div>
    </a>

    <a class="card" href="#">
      <div class="placeholder">Tourney 4</div>
    </a>

    <a class="card" href="#">
      <div class="placeholder">Tourney 5</div>
    </a>

    <a class="card" href="#">
      <div class="placeholder">Tourney 6</div>
    </a>

  </div>

</div>

</body>
</html>
