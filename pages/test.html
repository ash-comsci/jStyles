<!DOCTYPE html><!DOCTYPE="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sideline Hat | jStyles</title>

<!-- ✅ Fonts (FIXED) -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

<!-- ✅ Main Styles -->
<link rel="stylesheet" href="../css/styles.css">

<style>

/* Background */
body {
    font-family: 'DM Sans', sans-serif;
    background: #0d0d0d;
    color: white;
    margin: 0;
}

/* ✅ Sticky Navbar */
.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(6px);
}

/* Main */
.product-container {
    text-align: center;
    padding: 80px 20px;
}

/* Title */
.product-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 4rem;
    letter-spacing: 3px;
}

.product-title span {
    color: orange;
}

/* Subtitle */
.product-subtitle {
    color: #aaa;
    margin-bottom: 40px;
}

/* Image */
.product-image {
    position: relative;
    margin: 40px auto;
}

.product-image::before {
    content: '';
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255,165,0,0.25), transparent 70%);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.product-image img {
    max-width: 360px;
    width: 100%;
    transition: 0.35s;
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.7));
}

.product-image img:hover {
    transform: scale(1.08);
    filter: drop-shadow(0 20px 35px rgba(255,165,0,0.4));
}

/* Info Card */
.product-card {
    background: #151515;
    padding: 30px;
    border-radius: 15px;
    max-width: 500px;
    margin: 30px auto;
}

/* Price */
.price {
    color: orange;
    font-size: 1.3rem;
    font-weight: bold;
}

/* Button */
.cta-btn {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    background: orange;
    color: black;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
}

.cta-btn:hover {
    background: #ff8800;
}

</style>
</head>

<body>

<!-- ✅ NAVBAR (FIXED) -->
<header class="navbar">
  <div class="nav-container">
    <a href="../index.html" class="nav-logo">
      <img src="../images/jstyles-logo.png" alt="Logo">
    </a>
    <nav class="nav-menu">
      <a href="../index.html">Home</a>
      <a href="wos_swag.html">WOS Swag</a>
      <a href="tournament_swag.html">Tournament Swag</a>
      <a href="#contact">Contact Us</a>
    </nav>
  </div>
</header>

<!-- ✅ PRODUCT -->
<div class="product-container">

    <h1 class="product-title">
        SIDELINE <span>HAT</span>
    </h1>

    <p class="product-subtitle">
        Clean. Bold. Game-ready style.
    </p>

    <div class="product-image">
        <img src="../images/black_hat.png" alt="Black Hat">
    </div>

    <div class="product-card">
        <div class="price">Txt or Email for Pricing</div>

        <p>
            A sleek sideline essential designed for comfort and style.
            Perfect for game days, training, or everyday wear.
        </p>

        <button class="cta-btn">Showcase Item</button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
