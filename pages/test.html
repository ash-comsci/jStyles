<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sideline Hat | jStyles</title>

<!-- Fonts (same feel as WOS page) -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/styles.css">

<style>
/* Page styling */
body {
    font-family: 'DM Sans', sans-serif;
    background: #0d0d0d;
    color: white;
    margin: 0;
}

/* Sticky Navbar */
.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(8px);
}

/* Main container */
.product-container {
    text-align: center;
    padding: 60px 20px;
}

/* Title styling */
.product-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem;
    letter-spacing: 2px;
}

.product-title span {
    color: orange;
}

/* Image styling */
.product-image {
    margin: 40px auto;
}

.product-image img {
    max-width: 320px;
    width: 100%;
    border-radius: 12px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

/* Hover effect for creativity */
.product-image img:hover {
    transform: scale(1.08);
    box-shadow: 0 0 25px rgba(255,165,0,0.6);
}

/* Details */
.product-details {
    max-width: 500px;
    margin: 0 auto;
}

.price {
    margin: 15px 0;
    font-weight: bold;
    color: orange;
    font-size: 1.2rem;
}

/* Button */
.showcase-btn {
    margin-top: 20px;
    padding: 10px 25px;
    border: none;
    background: orange;
    color: black;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
    transition: background 0.3s;
}

.showcase-btn:hover {
    background: #ff8800;
}
</style>
</head>

<body>

<!-- ✅ NAVBAR (same structure as WOS page) -->
<header class="navbar">
  <div class="nav-container">
    <a href="../index.html" class="nav-logo">
      <img src="../images/jstyles-logo.png" alt="Logo">
    </a>
    <nav class="nav-menu">
      <a href="../index.html">Home</a>
      <a href="wos_swag.html">WOS Swag</a>
      <a href="tournament_swag.html">Tournament Swag</a>
      <a href="#contact">Contact Us</a>
    </nav>
  </div>
</header>

<!-- ✅ PRODUCT SECTION -->
<div class="product-container">

    <h1 class="product-title">
        SIDELINE <span>HAT</span>
    </h1>

    <div class="product-image">
        <img src="../images/black_hat.png" alt="Black Hat">
    </div>

    <div class="product-details">
        <div class="price">Txt or Email for Pricing</div>
        <p>Sideline Hat With Style</p>

        <button class="showcase-btn">Showcase Item</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
