<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sideline Hat | jStyles</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/styles.css">

<style>
/* Page styling */
body {
    font-family: 'DM Sans', sans-serif;
    background: #0d0d0d;
    color: #ffffff;
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* Sticky Navbar */
.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

/* Main container - Now a rounded card */
.product-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    
    /* Container styling */
    background: #151515; /* Slightly lighter than the background to stand out */
    border-radius: 30px; /* Beautiful curved corners */
    margin: 60px auto; /* Centers it with space around */
    padding: 60px 40px;
    width: 90%;
    max-width: 800px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    border: 1px solid rgba(255, 255, 255, 0.05);
}

/* Title styling */
.product-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 4.5rem;
    letter-spacing: 4px;
    margin: 0;
    text-transform: uppercase;
    text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
}

.product-title span {
    color: orange;
}

/* Image styling - Slightly smaller than before */
.product-image {
    position: relative;
    margin: 30px auto 40px;
    width: 100%;
    max-width: 450px; /* Scaled down slightly */
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Subtle glow behind the hat */
.product-image::before {
    content: '';
    position: absolute;
    width: 250px;
    height: 250px;
    background: radial-gradient(circle, rgba(255,165,0,0.15) 0%, rgba(13,13,13,0) 70%);
    border-radius: 50%;
    z-index: -1;
}

.product-image img {
    width: 100%;
    max-width: 380px; /* Scaled down slightly */
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.4s ease;
}

/* Enhanced Hover effect */
.product-image img:hover {
    transform: scale(1.05) translateY(-8px);
    filter: drop-shadow(0 20px 30px rgba(255,165,0,0.3));
}

/* Details */
.product-details {
    max-width: 500px;
    margin: 0 auto;
}

.product-details p {
    font-size: 1.1rem;
    color: #cccccc;
    margin: 0;
}

.price {
    margin-bottom: 5px;
    font-weight: 700;
    color: orange;
    font-size: 1.4rem;
    letter-spacing: 1px;
}
</style>
</head>

<body>

<header class="navbar">
  <div class="nav-container">
    <a href="../index.html" class="nav-logo">
      <img src="../images/jstyles-logo.png" alt="Logo">
    </a>
    <nav class="nav-menu">
      <a href="../index.html">Home</a>
      <a href="wos_swag.html">WOS Swag</a>
      <a href="tournament_swag.html">Tournament Swag</a>
      <a href="#contact">Contact Us</a>
    </nav>
  </div>
</header>

<div class="product-container">

    <h1 class="product-title">
        SIDELINE <span>HAT</span>
    </h1>

    <div class="product-image">
        <img src="../images/black_hat.png" alt="Black Hat">
    </div>

    <div class="product-details">
        <div class="price">Txt or Email for Pricing</div>
        <p>Sideline Hat With Style</p>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
