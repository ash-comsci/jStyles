<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sideline Hat | jStyles</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/styles.css">

<style>
/* Page styling */
body {
    font-family: 'DM Sans', sans-serif;
    background: #0d0d0d;
    color: #ffffff;
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh; /* Ensures full height for centering */
}

/* Sticky Navbar */
.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

/* Main container - Centered Layout */
.product-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px 80px;
    text-align: center;
}

/* Title styling */
.product-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 5rem; /* Increased size */
    letter-spacing: 4px;
    margin: 0;
    text-transform: uppercase;
    text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
}

.product-title span {
    color: orange;
}

/* Image styling - Made significantly larger and more prominent */
.product-image {
    position: relative;
    margin: 30px auto 40px;
    width: 100%;
    max-width: 600px; /* Increased from 320px */
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Subtle glow behind the hat */
.product-image::before {
    content: '';
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255,165,0,0.15) 0%, rgba(13,13,13,0) 70%);
    border-radius: 50%;
    z-index: -1;
}

.product-image img {
    width: 100%;
    max-width: 500px;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8)); /* Replaced border-radius with drop-shadow for transparent PNGs */
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.4s ease;
}

/* Enhanced Hover effect */
.product-image img:hover {
    transform: scale(1.05) translateY(-10px);
    filter: drop-shadow(0 20px 30px rgba(255,165,0,0.3));
}

/* Details */
.product-details {
    max-width: 500px;
    margin: 0 auto;
}

.product-details p {
    font-size: 1.1rem;
    color: #cccccc;
    margin-bottom: 25px;
}

.price {
    margin: 10px 0;
    font-weight: 700;
    color: orange;
    font-size: 1.4rem;
    letter-spacing: 1px;
}

/* Button */
.showcase-btn {
    padding: 14px 40px;
    border: none;
    background: orange;
    color: #000000;
    font-family: 'DM Sans', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 30px; /* Pill-shaped modern button */
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(255, 165, 0, 0.2);
}

.showcase-btn:hover {
    background: #ff9900;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 165, 0, 0.4);
}
</style>
</head>

<body>

<header class="navbar">
  <div class="nav-container">
    <a href="../index.html" class="nav-logo">
      <img src="../images/jstyles-logo.png" alt="Logo">
    </a>
    <nav class="nav-menu">
      <a href="../index.html">Home</a>
      <a href="wos_swag.html">WOS Swag</a>
      <a href="tournament_swag.html">Tournament Swag</a>
      <a href="#contact">Contact Us</a>
    </nav>
  </div>
</header>

<div class="product-container">

    <h1 class="product-title">
        SIDELINE <span>HAT</span>
    </h1>

    <div class="product-image">
        <img src="../images/black_hat.png" alt="Black Hat">
    </div>

    <div class="product-details">
        <div class="price">Txt or Email for Pricing</div>
        <p>Sideline Hat With Style</p>

        <button class="showcase-btn">Showcase Item</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
