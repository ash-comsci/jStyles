     Place this file in your ROOT folder.
     Your order form can load it with: fetch('/nav.html')
-->

<style>
  :root {
    --nav-black: #050505;
    --nav-red: #e11919;
    --nav-white: #efe8df;
    --nav-muted: #9a9188;
  }

  #navbar {
    position: sticky;
    top: 0;
    z-index: 950;
    width: 100%;
  }

  .navbar {
    position: sticky;
    top: 0;
    z-index: 950;
    width: 100%;
    min-height: 76px;
    background:
      linear-gradient(90deg, rgba(225,25,25,0.34), transparent 26%, transparent 72%, rgba(225,25,25,0.24)),
      rgba(5,5,5,0.97);
    border-bottom: 2px solid rgba(225,25,25,0.55);
    box-shadow: 0 18px 44px rgba(0,0,0,0.46);
    backdrop-filter: blur(14px);
    transition: min-height .2s ease, background .2s ease, box-shadow .2s ease;
  }

  .navbar.scrolled {
    min-height: 64px;
    background: rgba(5,5,5,0.99);
    box-shadow: 0 16px 36px rgba(0,0,0,0.68);
  }

  .nav-container {
    width: min(1220px, calc(100% - 32px));
    min-height: inherit;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  .nav-logo {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    color: var(--nav-white);
    text-decoration: none;
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 30px;
    letter-spacing: .16em;
    text-transform: uppercase;
    line-height: 1;
    white-space: nowrap;
  }

  .nav-logo img {
    width: 48px;
    height: 48px;
    object-fit: contain;
    filter: drop-shadow(0 0 16px rgba(225,25,25,0.45));
  }

  .nav-logo span {
    color: var(--nav-red);
  }

  .nav-menu {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .nav-menu a {
    position: relative;
    display: inline-flex;
    align-items: center;
    min-height: 42px;
    padding: 10px 14px;
    color: var(--nav-white);
    text-decoration: none;
    border: 1px solid transparent;
    border-radius: 3px;
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 16px;
    letter-spacing: .14em;
    text-transform: uppercase;
    transition: color .2s ease, background .2s ease, border-color .2s ease, transform .15s ease;
  }

  .nav-menu a:hover,
  .nav-menu a.active {
    color: #fff;
    background: rgba(225,25,25,0.20);
    border-color: rgba(225,25,25,0.52);
    transform: translateY(-1px);
  }

  .nav-menu a.active::after {
    content: '';
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 5px;
    height: 2px;
    background: var(--nav-red);
    box-shadow: 0 0 16px rgba(225,25,25,0.76);
  }

  .nav-toggle {
    display: none;
    width: 44px;
    height: 44px;
    align-items: center;
    justify-content: center;
    gap: 5px;
    flex-direction: column;
    background: rgba(0,0,0,0.42);
    border: 1px solid rgba(255,255,255,0.20);
    border-radius: 4px;
    cursor: pointer;
    padding: 0;
  }

  .nav-toggle span,
  .nav-toggle::before,
  .nav-toggle::after {
    content: '';
    width: 22px;
    height: 2px;
    background: var(--nav-white);
    display: block;
    transition: transform .2s ease, opacity .2s ease;
  }

  .nav-toggle.open span {
    opacity: 0;
  }

  .nav-toggle.open::before {
    transform: translateY(7px) rotate(45deg);
  }

  .nav-toggle.open::after {
    transform: translateY(-7px) rotate(-45deg);
  }

  @media (max-width: 820px) {
    .nav-container {
      width: min(100% - 24px, 1220px);
      min-height: 68px;
    }

    .nav-logo {
      font-size: 24px;
      letter-spacing: .12em;
    }

    .nav-logo img {
      width: 40px;
      height: 40px;
    }

    .nav-toggle {
      display: inline-flex;
    }

    .nav-menu {
      position: absolute;
      top: 100%;
      left: 12px;
      right: 12px;
      display: grid;
      gap: 8px;
      padding: 14px;
      background: rgba(5,5,5,0.98);
      border: 1px solid rgba(225,25,25,0.40);
      border-top: none;
      box-shadow: 0 18px 38px rgba(0,0,0,0.62);
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    .nav-menu.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .nav-menu a {
      width: 100%;
      justify-content: center;
    }
  }


  /* ==========================================================
     FANCY NAV BUTTON HOVER EFFECTS
     Put these rules at the END of nav.html's <style> block.
     They override the basic nav hover above.
     ========================================================== */

  .nav-menu li {
    position: relative !important;
  }

  .nav-menu a {
    position: relative !important;
    overflow: hidden !important;
    isolation: isolate !important;
    padding: 11px 16px !important;
    border: 1px solid rgba(255,255,255,0.10) !important;
    border-radius: 7px !important;
    background:
      linear-gradient(120deg, transparent 0%, transparent 38%, rgba(255,255,255,0.24) 50%, transparent 62%, transparent 100%),
      rgba(255,255,255,0.025) !important;
    background-size: 240% 100%, 100% 100% !important;
    background-position: 115% 0, 0 0 !important;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02) !important;
    color: rgba(239,232,223,0.86) !important;
    transform: translateY(0) scale(1) !important;
    transition:
      color .18s ease,
      background-color .18s ease,
      background-position .42s ease,
      border-color .18s ease,
      box-shadow .18s ease,
      text-shadow .18s ease,
      transform .18s ease !important;
  }

  .nav-menu a::before {
    content: '' !important;
    position: absolute !important;
    inset: 0 !important;
    z-index: -1 !important;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.18), transparent 38%),
      linear-gradient(135deg, rgba(225,25,25,0.18), rgba(225,25,25,0.46)) !important;
    opacity: 0 !important;
    transform: scale(0.72) !important;
    transition: opacity .18s ease, transform .18s ease !important;
  }

  .nav-menu a::after {
    content: '' !important;
    position: absolute !important;
    left: 13px !important;
    right: 13px !important;
    bottom: 5px !important;
    height: 2px !important;
    background: var(--nav-red) !important;
    box-shadow:
      0 0 12px rgba(225,25,25,0.92),
      0 0 26px rgba(225,25,25,0.56) !important;
    transform: scaleX(0) !important;
    transform-origin: center !important;
    transition: transform .18s ease !important;
  }

  .nav-menu a:hover,
  .nav-menu a:focus-visible,
  .nav-menu a.active {
    color: #fff !important;
    background-position: -35% 0, 0 0 !important;
    background-color: rgba(225,25,25,0.22) !important;
    border-color: rgba(225,25,25,0.80) !important;
    transform: translateY(-4px) scale(1.06) !important;
    box-shadow:
      0 14px 28px rgba(0,0,0,0.42),
      0 0 22px rgba(225,25,25,0.38),
      inset 0 0 0 1px rgba(255,255,255,0.12) !important;
    text-shadow:
      0 0 10px rgba(255,255,255,0.35),
      0 0 18px rgba(225,25,25,0.80) !important;
  }

  .nav-menu a:hover::before,
  .nav-menu a:focus-visible::before,
  .nav-menu a.active::before {
    opacity: 1 !important;
    transform: scale(1) !important;
  }

  .nav-menu a:hover::after,
  .nav-menu a:focus-visible::after,
  .nav-menu a.active::after {
    transform: scaleX(1) !important;
  }

  .nav-menu a:active {
    transform: translateY(-1px) scale(0.98) !important;
  }

  .nav-toggle:hover {
    border-color: rgba(225,25,25,0.82) !important;
    background: rgba(225,25,25,0.20) !important;
    box-shadow: 0 0 20px rgba(225,25,25,0.34) !important;
    transform: translateY(-2px) scale(1.04) !important;
  }

</style>

<header class="navbar">
  <div class="nav-container">

    <a href="/index.html" class="nav-logo" aria-label="jStyles Home">
      <img src="/images/jstyles_logo.png" alt="jStyles Logo" onerror="this.style.display='none'">
      <strong>J<span>STYLES</span></strong>
    </a>

    <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
      <span></span>
    </button>

    <nav aria-label="Main navigation">
      <ul class="nav-menu">
        <li><a href="/index.html">Home</a></li>
        <li><a href="/WOS/index.html">Fan Gear</a></li>
        <li><a href="/tournament/index.html">Tournament MERCH</a></li>
        <li><a href="/custom/index.html">Custom MERCH</a></li>
        <li><a href="/test/pages/contact.html">Contact</a></li>
      </ul>
    </nav>

  </div>
</header>
