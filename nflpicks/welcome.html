<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>j-NFLPicks | Let's Ride</title>
<meta name="description" content="The family's weekly football picks. Kickoff to Season HQ.">
<!-- Fallback: if scripts are off, still head to Season HQ -->
<noscript><meta http-equiv="refresh" content="3;url=index.html"></noscript>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23002244'/%3E%3Ctext x='10' y='24' font-family='Arial' font-weight='bold' font-size='26' fill='%23FB4F14'%3Ej%3C/text%3E%3C/svg%3E">
<style>
:root{--navy:#002244;--deep:#00152b;--orange:#fb4f14;--hot:#ff7848;--cream:#f5f4ef}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 45%,#0a3460 0%,var(--navy) 38%,var(--deep) 100%);color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden;cursor:pointer;display:grid;place-items:center}
.stage{position:relative;width:100%;height:100%;display:grid;place-items:center;transform-origin:50% 45%}

/* field yard lines */
.field{position:absolute;inset:0;opacity:.07;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 2px),#fff calc(10% - 2px),#fff 10%);animation:fieldIn 1.2s ease-out both}
/* rotating retro sunburst */
.burst{position:absolute;width:190vmax;height:190vmax;left:50%;top:45%;translate:-50% -50%;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(251,79,20,.16) 0deg 7deg,transparent 7deg 15deg);
  mask:radial-gradient(circle,#000 8%,transparent 62%);-webkit-mask:radial-gradient(circle,#000 8%,transparent 62%);
  animation:burstIn 1.1s .25s cubic-bezier(.2,.9,.3,1) both,spin 40s linear infinite}

.center{position:relative;display:flex;flex-direction:column;align-items:center;gap:2.4vmin;margin-top:-4vmin;z-index:2}

/* emblem */
.emblem{width:min(58vmin,420px);aspect-ratio:1;filter:drop-shadow(0 2.5vmin 0 rgba(0,0,0,.28));
  animation:zoomIn 1.25s cubic-bezier(.17,.89,.32,1.28) both}
.emblem .ringtext{animation:spin 18s linear infinite;transform-origin:200px 200px}
.emblem .ball{transform-origin:200px 200px;animation:wobble 1.25s .2s ease-out both}
.emblem .jmark{transform-origin:200px 214px;animation:pop .6s 1s cubic-bezier(.2,1.6,.4,1) both}
.flash{position:absolute;width:min(58vmin,420px);aspect-ratio:1;border-radius:50%;left:50%;top:0;translate:-50% 0;
  background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.0) 65%);opacity:0;animation:flash .7s 1s ease-out both;pointer-events:none}

/* headline */
.title{font:clamp(54px,12vmin,128px)/.9 Impact,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:-.01em;margin:0;display:flex;gap:.04em;white-space:nowrap}
.title span{display:inline-block;opacity:0;animation:slam .45s cubic-bezier(.2,1.5,.4,1) both;text-shadow:.06em .06em 0 var(--orange)}
.title .o{color:var(--orange);text-shadow:.06em .06em 0 #fff}
.tag{font-size:clamp(10px,1.7vmin,14px);font-weight:700;letter-spacing:.35em;color:#c5d5e2;opacity:0;animation:rise .6s 2.25s ease-out both;text-align:center;padding:0 16px}
.tag b{color:var(--hot)}

/* loader */
.loader{position:absolute;bottom:7vh;left:50%;translate:-50% 0;width:min(320px,70vw);text-align:center;z-index:3;opacity:0;animation:rise .5s 1.6s ease-out both}
.bar{height:6px;background:#1d3d5e;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--orange),var(--hot));transform-origin:left;transform:scaleX(0);animation:load 3s 1.6s linear both}
.loader p{margin:10px 0 0;font-size:10px;letter-spacing:.25em;color:#9fb4c8;font-weight:700}
.skip{position:absolute;top:18px;right:18px;z-index:4;background:transparent;color:#fff;border:1px solid #5d7b98;border-radius:4px;padding:10px 14px;font:700 11px Arial,sans-serif;letter-spacing:.1em;cursor:pointer;opacity:0;animation:rise .4s .6s both}
.skip:hover{background:#123d62}
.skip:focus-visible{outline:3px solid #2385ce;outline-offset:4px}

/* confetti footballs + stars */
.bits{position:absolute;inset:0;pointer-events:none;z-index:1}
.bit{position:absolute;left:50%;top:42%;opacity:0;animation:fly 1.6s cubic-bezier(.15,.7,.3,1) both}

/* exit: dive into the emblem */
body.leaving .stage{animation:dive .75s cubic-bezier(.6,0,.9,.4) forwards}
body.leaving .wipe{animation:wipe .75s ease-in forwards}
.wipe{position:fixed;inset:0;background:var(--cream);opacity:0;pointer-events:none;z-index:10}

@keyframes zoomIn{0%{transform:scale(.02) rotate(-200deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes wobble{0%{transform:rotate(-35deg)}70%{transform:rotate(8deg)}100%{transform:rotate(0)}}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes flash{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.7)}}
@keyframes spin{to{rotate:360deg}}
@keyframes burstIn{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:scale(1)}}
@keyframes fieldIn{from{opacity:0}}
@keyframes slam{0%{opacity:0;transform:translateY(-60%) scale(2.4) rotate(-8deg)}100%{opacity:1;transform:none}}
@keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
@keyframes load{to{transform:scaleX(1)}}
@keyframes fly{0%{opacity:1;transform:translate(-50%,-50%) scale(.3) rotate(0)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(var(--r))}}
@keyframes dive{to{transform:scale(9);opacity:0}}
@keyframes wipe{60%{opacity:0}100%{opacity:1}}

@media(max-width:600px){.title{font-size:16vw}.emblem{width:72vw}.flash{width:72vw}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<button class="skip" type="button" id="skip">SKIP INTRO &#8594;</button>
<div class="stage" id="stage">
  <div class="field" aria-hidden="true"></div>
  <div class="burst" aria-hidden="true"></div>
  <div class="bits" id="bits" aria-hidden="true"></div>

  <main class="center">
    <div class="flash" aria-hidden="true"></div>
    <!-- Original j-NFLPicks retro emblem -->
    <svg class="emblem" viewBox="0 0 400 400" role="img" aria-label="j-NFLPicks emblem">
      <defs>
        <path id="ring" d="M200,200 m-150,0 a150,150 0 1,1 300,0 a150,150 0 1,1 -300,0"/>
        <clipPath id="inner"><circle cx="200" cy="200" r="122"/></clipPath>
      </defs>
      <!-- outer retro rings -->
      <circle cx="200" cy="200" r="196" fill="#fb4f14"/>
      <circle cx="200" cy="200" r="184" fill="#fff"/>
      <circle cx="200" cy="200" r="176" fill="#002244"/>
      <text class="ringtext" font-family="Impact,'Arial Narrow',sans-serif" font-size="27" letter-spacing="5" fill="#fff">
        <textPath href="#ring">j-NFLPICKS ★ FAMILY LEAGUE ★ LET'S RIDE ★ 2026 ★ </textPath>
      </text>
      <circle cx="200" cy="200" r="128" fill="#fb4f14"/>
      <!-- retro speed stripes -->
      <g clip-path="url(#inner)">
        <circle cx="200" cy="200" r="122" fill="#fb4f14"/>
        <g fill="#002244" opacity=".9">
          <rect x="40" y="248" width="320" height="12"/>
          <rect x="40" y="270" width="320" height="12"/>
          <rect x="40" y="292" width="320" height="40"/>
        </g>
      </g>
      <!-- football -->
      <g class="ball">
        <ellipse cx="200" cy="200" rx="104" ry="62" transform="rotate(-28 200 200)" fill="#7a2e12" stroke="#fff" stroke-width="7"/>
        <g transform="rotate(-28 200 200)" stroke="#fff" stroke-linecap="round">
          <path d="M120 176 q8 24 0 48" stroke-width="6" fill="none"/>
          <path d="M280 176 q-8 24 0 48" stroke-width="6" fill="none"/>
        </g>
      </g>
      <!-- the j mark -->
      <g class="jmark">
        <rect x="154" y="150" width="92" height="104" rx="8" fill="#002244" stroke="#fff" stroke-width="6" transform="skewX(-8) translate(28 0)"/>
        <text x="203" y="241" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-style="italic" font-size="108" fill="#fb4f14">j</text>
      </g>
    </svg>

    <h1 class="title" id="title" aria-label="Let's ride!"></h1>
    <p class="tag">ORANGE <b>&amp;</b> BLUE <b>·</b> THROUGH <b>&amp;</b> THROUGH</p>
  </main>

  <div class="loader" aria-hidden="true"><div class="bar"><i></i></div><p>HEADING TO SEASON HQ</p></div>
</div>
<div class="wipe" aria-hidden="true"></div>

<script>
'use strict';
const DESTINATION = 'index.html';   // where the intro sends people
const INTRO_MS    = 4700;           // how long the intro plays before leaving

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Slam in the headline letter by letter
const title = document.getElementById('title');
"LET'S RIDE!".split('').forEach((ch,i)=>{
  const s = document.createElement('span');
  s.setAttribute('aria-hidden','true');
  s.textContent = ch === ' ' ? ' ' : ch;
  if (ch === '!' || i > 5) s.className = 'o';
  s.style.animationDelay = (1.3 + i*0.07) + 's';
  title.append(s);
});

// Burst of footballs and stars when the emblem lands
if (!reduced) {
  const bits = document.getElementById('bits');
  const shapes = ['🏈','★','★','✦'];
  for (let i=0;i<26;i++){
    const b = document.createElement('span');
    b.className = 'bit';
    const shape = shapes[i % shapes.length];
    b.textContent = shape;
    const angle = Math.random()*Math.PI*2, dist = 28 + Math.random()*30;
    b.style.setProperty('--x', Math.cos(angle)*dist + 'vmax');
    b.style.setProperty('--y', Math.sin(angle)*dist + 'vmax');
    b.style.setProperty('--r', (Math.random()*720-360) + 'deg');
    b.style.fontSize = (shape==='🏈' ? 22+Math.random()*20 : 14+Math.random()*22) + 'px';
    b.style.color = Math.random() > .4 ? '#fb4f14' : '#ffffff';
    b.style.animationDelay = (1 + Math.random()*.25) + 's';
    bits.append(b);
  }
}

// Leave for Season HQ
let gone = false;
function go(){
  if (gone) return; gone = true;
  if (reduced) { location.replace(DESTINATION); return; }
  document.body.classList.add('leaving');
  setTimeout(()=>location.replace(DESTINATION), 720);
}
setTimeout(go, reduced ? 1500 : INTRO_MS);
document.getElementById('skip').addEventListener('click', e=>{ e.stopPropagation(); go(); });
document.body.addEventListener('click', go);
addEventListener('keydown', e=>{ if (e.key==='Enter' || e.key===' ' || e.key==='Escape') go(); });
</script>
</body>
</html>
