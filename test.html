<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>jStyles WOS Apparel</title>

<link rel="icon" type="image/x-icon" href="images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
 font-family: 'DM Sans', sans-serif;
 background:
 radial-gradient(ellipse 140% 45% at 50% 0%, #b8b8b8 0%, #787878 20%, transparent 50%),
 radial-gradient(ellipse 80% 40% at 15% 50%, rgba(160,160,160,0.22) 0%, transparent 55%),
 radial-gradient(ellipse 80% 40% at 85% 50%, rgba(160,160,160,0.22) 0%, transparent 55%),
 radial-gradient(ellipse 110% 45% at 50% 100%, #9b0f0f 0%, #5c0808 30%, transparent 60%),
 linear-gradient(170deg, #4a4a4a 0%, #252525 30%, #181818 52%, #2c0909 75%, #450c0c 100%);
 color: #f0ece4;
 padding: 60px 20px;
 display: flex;
 justify-content: center;
}

/* grid overlay */
body::before {
 content: '';
 position: fixed;
 inset: 0;
 background:
 repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.02) 39px, rgba(255,255,255,0.02) 40px);
 pointer-events: none;
}

/* red glow */
body::after {
 content: '';
 position: fixed;
 top: 140px;
 left: 50%;
 transform: translateX(-50%);
 width: 500px;
 height: 250px;
 background: radial-gradient(ellipse, rgba(215,35,35,0.2), transparent 70%);
 animation: pulse 4s ease-in-out infinite;
}

@keyframes pulse {
 0%,100% { opacity: 0.5; transform: translateX(-50%) scale(1); }
 50% { opacity: 1; transform: translateX(-50%) scale(1.15); }
}

/* container */
.container {
 max-width: 1000px;
 width: 100%;
}

/* header */
.header {
 text-align: center;
 margin-bottom: 40px;
 animation: fadeIn 1s ease both;
}

.header h1 {
 font-family: 'Bebas Neue';
 font-size: clamp(48px, 8vw, 68px);
 letter-spacing: 3px;
}

.header span {
 color: #d72323;
}

/* animation */
@keyframes fadeIn {
 from { opacity: 0; transform: translateY(20px);}
 to { opacity: 1; transform: translateY(0);}
}

/* grid */
.grid {
 display: grid;
 grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
 gap: 22px;
 animation: fadeIn 1s .3s ease both;
}

/* card */
.card {
 display: block;
 position: relative;
 border-radius: 6px;
 overflow: hidden;
 text-decoration: none;
 background: #111;
 border: 1px solid #333;
 transition: all 0.3s ease;
}

.card img {
 width: 100%;
 height: 260px;
 object-fit: cover;
}

/* label */
.card-label {
 position: absolute;
 bottom: 0;
 width: 100%;
 padding: 14px;
 background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
 font-family: 'Bebas Neue';
 font-size: 20px;
 letter-spacing: 2px;
 color: #fff;
}

/* hover */
.card:hover {
 transform: translateY(-6px);
 border-color: #d72323;
 box-shadow:
 0 16px 50px rgba(0,0,0,0.6),
 0 0 35px rgba(215,35,35,0.4);
}

.card:hover .card-label {
 color: #d72323;
}
 /* NAVBAR */
.navbar {
 position: sticky;
 top: 0;
 width: 100%;
 z-index: 1000;

 background: rgba(15, 15, 15, 0.85);
 backdrop-filter: blur(10px);
 border-bottom: 1px solid rgba(255,255,255,0.05);
}

/* container */
.nav-container {
 max-width: 1200px;
 margin: 0 auto;
 display: flex;
 justify-content: space-between;
 align-items: center;
 padding: 12px 20px;
}

/* logo */
.nav-logo img {
 height: 42px;
 display: block;
 filter:
 drop-shadow(0 2px 6px rgba(0,0,0,0.8))
 drop-shadow(0 0 12px rgba(215,35,35,0.35));
}

/* menu */
.nav-menu {
 display: flex;
 gap: 28px;
}

/* links */
.nav-menu a {
 text-decoration: none;
 color: #ddd;
 font-family: 'Bebas Neue', sans-serif;
 font-size: 18px;
 letter-spacing: 1.5px;
 position: relative;
 transition: 0.3s ease;
}

/* underline animation */
.nav-menu a::after {
 content: "";
 position: absolute;
 left: 0;
 bottom: -6px;
 width: 0%;
 height: 2px;
 background: #d72323;
 transition: width 0.3s ease;
}

/* hover */
.nav-menu a:hover {
 color: #fff;
}

.nav-menu a:hover::after {
 width: 100%;
}

/* active feel (optional) */
.nav-menu a.active {
 color: #d72323;
}

/* MOBILE */
@media (max-width: 768px) {
 .nav-menu {
   gap: 16px;
 }

 .nav-menu a {
   font-size: 16px;
 }
}

</style>
</head>

<body>
<header class="navbar">
  <div class="nav-container">

    <!-- LOGO -->
    <div class="nav-logo">
      <img src="images/jstyles-logo.png" alt="jStyles Logo">
    </div>

    <!-- NAV LINKS -->
    <nav class="nav-menu">
      <a href="index.html">Home</a>
      <a href="wos_swag.html">WOS Swag</a>
      <a href="tournament_swag.html">Tournament Swag</a>
      <a href="#contact">Contact Us</a>
    </nav>

  </div>
</header>
<div class="container">

 <!-- HEADER -->
 <div class="header">
   <h1>WOS <span>SWAG</span></h1>
 </div>

 <!-- GRID -->
 <div class="grid">

   <a class="card" href="black_hoodie.html" target="_blank">
     <img src="images/black_hoodie.png" alt="Elite Hoodie">
     <div class="card-label">Elite Hoodie</div>
   </a>

   <a class="card" href="black_tank.html" target="_blank">
     <img src="images/black_Tank.png" alt="Sideline Tank">
     <div class="card-label">Sideline Tank</div>
   </a>

   <a class="card" href="black_tshirt.html" target="_blank">
     <img src="images/black_Tshirt.png" alt="Sideline Tee">
     <div class="card-label">Sideline Tee</div>
   </a>

   <a class="card" href="black_hat.html" target="_blank">
     <img src="images/black_hat.png" alt="Ball Cap">
     <div class="card-label">Ball Cap</div>
   </a>

 </div>

</div>

</body>
</html>
