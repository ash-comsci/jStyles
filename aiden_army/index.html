<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020703" />
  <meta name="description" content="Aiden’s Army fundraiser apparel." />
  <title>Aiden’s Army</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./aiden_army_intro.css" />
  <script defer src="./aiden_army_intro.js"></script>
</head>
<body>
  <main class="intro" id="intro" aria-labelledby="introTitle">
    <div class="aurora aurora-one" aria-hidden="true"></div>
    <div class="aurora aurora-two" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <div class="intro-content">
      <div class="logo-stage" aria-hidden="true">
        <span class="orbit orbit-one"></span>
        <span class="orbit orbit-two"></span>
        <span class="pulse-ring pulse-one"></span>
        <span class="pulse-ring pulse-two"></span>
        <img class="intro-logo" src="./images/aiden_army_logo.png" alt="" />
      </div>

      <h1 class="visually-hidden" id="introTitle">Aiden’s Army Fundraiser</h1>
    </div>
  </main>
</body>
</html>
