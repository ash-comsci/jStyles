<style>
  :root {
    --nav-black: #050505;
    --nav-red: #e11919;
    --nav-white: #efe8df;
    --nav-muted: #9a9188;
  }

  #navbar {
    position: sticky;
    top: 0;
    z-index: 950;
    width: 100%;
  }

  .navbar {
    position: sticky;
    top: 0;
    z-index: 950;
    width: 100%;
    min-height: 76px;
    background:
      linear-gradient(90deg, rgba(225,25,25,0.34), transparent 26%, transparent 72%, rgba(225,25,25,0.24)),
      rgba(5,5,5,0.97);
    border-bottom: 2px solid rgba(225,25,25,0.55);
    box-shadow: 0 18px 44px rgba(0,0,0,0.46);
    backdrop-filter: blur(14px);
    transition: min-height .2s ease, background .2s ease, box-shadow .2s ease;
  }

  .navbar.scrolled {
    min-height: 64px;
    background: rgba(5,5,5,0.99);
    box-shadow: 0 16px 36px rgba(0,0,0,0.68);
  }

  .nav-container {
    width: min(1220px, calc(100% - 32px));
    min-height: inherit;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  .nav-logo {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    color: var(--nav-white);
    text-decoration: none;
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 30px;
    letter-spacing: .16em;
    text-transform: uppercase;
    line-height: 1;
    white-space: nowrap;
  }

  .nav-logo img {
    width: 48px;
    height: 48px;
    object-fit: contain;
    filter: drop-shadow(0 0 16px rgba(225,25,25,0.45));
  }

  .nav-logo span {
    color: var(--nav-red);
  }

  .nav-menu {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .nav-menu a {
    position: relative;
    display: inline-flex;
    align-items: center;
    min-height: 42px;
    padding: 10px 14px;
    color: var(--nav-white);
    text-decoration: none;
    border: 1px solid transparent;
    border-radius: 3px;
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 16px;
    letter-spacing: .14em;
    text-transform: uppercase;
    transition: color .2s ease, background .2s ease, border-color .2s ease, transform .15s ease;
  }

  .nav-menu a:hover,
  .nav-menu a.active {
    color: #fff;
    background: rgba(225,25,25,0.20);
    border-color: rgba(225,25,25,0.52);
    transform: translateY(-1px);
  }

  .nav-menu a.active::after {
    content: '';
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 5px;
    height: 2px;
    background: var(--nav-red);
    box-shadow: 0 0 16px rgba(225,25,25,0.76);
  }

  .nav-toggle {
    display: none;
    width: 44px;
    height: 44px;
    align-items: center;
    justify-content: center;
    gap: 5px;
    flex-direction: column;
    background: rgba(0,0,0,0.42);
    border: 1px solid rgba(255,255,255,0.20);
    border-radius: 4px;
    cursor: pointer;
    padding: 0;
  }

  .nav-toggle span,
  .nav-toggle::before,
  .nav-toggle::after {
    content: '';
    width: 22px;
    height: 2px;
    background: var(--nav-white);
    display: block;
    transition: transform .2s ease, opacity .2s ease;
  }

  .nav-toggle.open span {
    opacity: 0;
  }

  .nav-toggle.open::before {
    transform: translateY(7px) rotate(45deg);
  }

  .nav-toggle.open::after {
    transform: translateY(-7px) rotate(-45deg);
  }

  @media (max-width: 820px) {
    .nav-container {
      width: min(100% - 24px, 1220px);
      min-height: 68px;
    }

    .nav-logo {
      font-size: 24px;
      letter-spacing: .12em;
    }

    .nav-logo img {
      width: 40px;
      height: 40px;
    }

    .nav-toggle {
      display: inline-flex;
    }

    .nav-menu {
      position: absolute;
      top: 100%;
      left: 12px;
      right: 12px;
      display: grid;
      gap: 8px;
      padding: 14px;
      background: rgba(5,5,5,0.98);
      border: 1px solid rgba(225,25,25,0.40);
      border-top: none;
      box-shadow: 0 18px 38px rgba(0,0,0,0.62);
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    .nav-menu.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .nav-menu a {
      width: 100%;
      justify-content: center;
    }
  }
</style>

<header class="navbar">
  <div class="nav-container">

   
<a class="nav-logo" href="/index.html">
  <img src="/images/jstyles_logo.png" alt="jStyles Logo" onerror="this.style.display='none'">
  <strong>J<span>STYLES</span></strong>
</a>

    <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
      <span></span>
    </button>

    <nav aria-label="Main navigation">
      <ul class="nav-menu">
        <li><a href="/index.html">Home</a></li>
        <li><a href="/WOS/index.html">Fan Gear</a></li>
        <li><a href="/tournament/index.html">Tournament MERCH</a></li>
            <li><a href="/aiden_army/index.html">Aiden's ARMY</a></li>
        <li><a href="/custom/index.html">Custom MERCH</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

  </div>
</header>
